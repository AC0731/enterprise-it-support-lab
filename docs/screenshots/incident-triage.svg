<text x="34" y="382" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Recommended actions:</text>
<text x="34" y="412" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">  1. Validate DNS server assignment, flush resolver cache, and retest name resolution.</text>

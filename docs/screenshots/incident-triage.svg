<text x="34" y="202" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">[PASS] disk_health              Disk usage is 61.8% (warning threshold 85%)</text>
<text x="34" y="232" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">[WARN] dns_health               DNS resolution for intranet.corp.example failed: temporary resolver failure</text>
<text x="34" y="262" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">[WARN] tcp_health               TCP connection to intranet.corp.example:443 failed: connection timed out</text>
<text x="34" y="292" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">[WARN] service:Print Spooler    Print Spooler status is Stopped</text>
<text x="34" y="322" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">--------------------------------------------------</text>

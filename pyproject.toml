[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-it-support-lab"
version = "0.3.0"
description = "Endpoint diagnostics, incident triage automation, and IT support runbooks"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Akanksha Chavda"}]

[project.scripts]
it-support = "itsupport:main"

[tool.setuptools]
py-modules = ["itsupport"]

[tool.setuptools.packages.find]
include = ["supportkit*"]
